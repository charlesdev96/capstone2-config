# Copy to grafana-admin-secret.yaml, set real values, then:
#   kubectl apply -f monitoring/grafana-admin-secret.yaml
# grafana-admin-secret.yaml is git-ignored. Never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE_ME_STRONG_PASSWORD
