apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitops-shop-services
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [shop]
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [gateway, users, orders, payments]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
