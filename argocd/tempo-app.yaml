apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-shop-tempo
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.17.2
      helm:
        releaseName: tempo
        valueFiles:
          - $values/monitoring/tempo-values.yaml
    - repoURL: https://github.com/charlesdev96/capstone2-config
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
