apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-shop-monitoring-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/charlesdev96/capstone2-config
    targetRevision: main
    path: monitoring
    directory:
      include: '{shop-servicemonitor.yaml,alerts.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
