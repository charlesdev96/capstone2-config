apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: shop
  labels:
    app: gateway
    app.kubernetes.io/part-of: gitops-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/part-of: gitops-shop
    spec:
      containers:
        - name: gateway
          image: ghcr.io/charlesdev96/gitops-shop-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: SERVICE_NAME
              value: "gateway"
            - name: USERS_URL
              value: "http://users:3002"
            - name: ORDERS_URL
              value: "http://orders:3003"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
